<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP Templates — Ahmed Hossam</title>
    <link rel="icon" type="image/png" href="https://iili.io/H5APPzG.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
    <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg: #07111e;
        --surface: #0c1a2e;
        --card: #0f2035;
        --card-hover: #132645;
        --border: #1a3054;
        --border-bright: #2a4a7f;
        --accent: #00cfff;
        --accent-dim: rgba(0,207,255,0.12);
        --accent2: #7c5cfc;
        --text: #e8f0fe;
        --text-dim: #8ba3c7;
        --text-muted: #4a6494;
        --radius: 12px;
        --radius-sm: 8px;
    }

    body {
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
        background: linear-gradient(135deg, #0a1628 0%, #0c1f3d 50%, #091628 100%);
        border-bottom: 1px solid var(--border);
        padding: 48px 24px 36px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    header::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 30% 40%, rgba(0,207,255,0.07) 0%, transparent 55%),
                    radial-gradient(ellipse at 70% 60%, rgba(124,92,252,0.07) 0%, transparent 55%);
        pointer-events: none;
    }

    .header-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--accent-dim);
        border: 1px solid rgba(0,207,255,0.3);
        color: var(--accent);
        padding: 4px 14px;
        border-radius: 100px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 18px;
    }

    header h1 {
        font-size: clamp(30px, 5vw, 52px);
        font-weight: 800;
        background: linear-gradient(135deg, #ffffff 0%, #00cfff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.15;
        margin-bottom: 10px;
    }

    header p {
        color: var(--text-dim);
        font-size: 15px;
        margin-bottom: 28px;
    }

    .profiles {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .profiles a {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 7px 16px;
        border: 1px solid var(--border-bright);
        border-radius: 100px;
        color: var(--text-dim);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.18s;
        background: rgba(255,255,255,0.02);
    }

    .profiles a:hover {
        border-color: var(--accent);
        color: var(--accent);
        background: var(--accent-dim);
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(0,207,255,0.12);
    }

    .profiles img { width: 18px; height: 18px; object-fit: contain; }

    /* ── CONTROLS ── */
    .controls {
        padding: 28px 24px 0;
        max-width: 1440px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .search-wrap { position: relative; }

    .search-wrap svg {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        pointer-events: none;
    }

    .search-input {
        width: 100%;
        padding: 14px 16px 14px 48px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-size: 15px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.18s, box-shadow 0.18s;
    }

    .search-input::placeholder { color: var(--text-muted); }

    .search-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(0,207,255,0.1);
    }

    .filter-pills {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .pill {
        padding: 6px 13px;
        border-radius: 100px;
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-dim);
        transition: all 0.18s;
        white-space: nowrap;
        -webkit-user-select: none;
        user-select: none;
    }

    .pill:hover { border-color: var(--border-bright); color: var(--text); }

    .pill.active {
        background: var(--accent-dim);
        border-color: rgba(0,207,255,0.4);
        color: var(--accent);
    }

    .pill .cnt {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 17px;
        padding: 0 4px;
        border-radius: 100px;
        background: rgba(255,255,255,0.07);
        font-size: 10.5px;
        margin-left: 4px;
    }

    /* ── STATS ── */
    .stats {
        padding: 14px 24px 4px;
        max-width: 1440px;
        margin: 0 auto;
        color: var(--text-muted);
        font-size: 13px;
    }

    .stats span { color: var(--text-dim); font-weight: 600; }

    /* ── GRID ── */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
        gap: 16px;
        padding: 8px 24px 56px;
        max-width: 1440px;
        margin: 0 auto;
    }

    /* ── CARD ── */
    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 11px;
        transition: all 0.18s;
        position: relative;
        overflow: hidden;
    }

    .card::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: var(--cat-color, var(--accent));
        opacity: 0;
        transition: opacity 0.18s;
    }

    .card:hover {
        background: var(--card-hover);
        border-color: var(--border-bright);
        transform: translateY(-3px);
        box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    }

    .card:hover::after { opacity: 1; }

    .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
    }

    .card-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        line-height: 1.4;
    }

    .card-icon {
        width: 34px;
        height: 34px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
        background: var(--cat-bg, rgba(0,207,255,0.1));
    }

    .cat-badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 9px;
        border-radius: 100px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--cat-color, var(--accent));
        background: var(--cat-bg, var(--accent-dim));
        align-self: flex-start;
    }

    .card-desc {
        font-size: 13px;
        color: var(--text-dim);
        line-height: 1.55;
        flex: 1;
    }

    .card-file {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: var(--text-muted);
    }

    .card-actions {
        display: flex;
        gap: 8px;
        margin-top: 2px;
    }

    .btn {
        flex: 1;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        border: none;
        transition: all 0.18s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .btn-view {
        background: rgba(0,207,255,0.09);
        color: var(--accent);
        border: 1px solid rgba(0,207,255,0.2);
    }

    .btn-view:hover { background: rgba(0,207,255,0.18); border-color: rgba(0,207,255,0.4); }

    .btn-dl {
        background: rgba(124,92,252,0.09);
        color: var(--accent2);
        border: 1px solid rgba(124,92,252,0.2);
    }

    .btn-dl:hover { background: rgba(124,92,252,0.18); border-color: rgba(124,92,252,0.4); }

    /* ── EMPTY ── */
    .empty {
        grid-column: 1/-1;
        text-align: center;
        padding: 80px 20px;
        color: var(--text-muted);
    }

    .empty h3 { font-size: 18px; margin-bottom: 8px; color: var(--text-dim); }

    /* ── MODAL ── */
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.72);
        -webkit-backdrop-filter: blur(5px);
        backdrop-filter: blur(5px);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
    }

    .overlay.open { opacity: 1; pointer-events: all; }

    .modal {
        background: #0c1a2e;
        border: 1px solid var(--border-bright);
        border-radius: 16px;
        width: 100%;
        max-width: 920px;
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: scale(0.95) translateY(12px);
        transition: transform 0.2s;
        box-shadow: 0 28px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,207,255,0.05);
    }

    .overlay.open .modal { transform: scale(1) translateY(0); }

    .modal-head {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
        background: rgba(255,255,255,0.01);
    }

    .modal-fname {
        flex: 1;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13.5px;
        font-weight: 500;
        color: var(--text);
    }

    .modal-acts { display: flex; gap: 8px; }

    .mbtn {
        padding: 6px 13px;
        border-radius: var(--radius-sm);
        font-size: 12.5px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        border: 1px solid var(--border-bright);
        background: var(--surface);
        color: var(--text-dim);
        transition: all 0.18s;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .mbtn:hover { color: var(--text); border-color: var(--accent); }
    .mbtn.ok { color: #10b981; border-color: #10b981; }

    .close-btn {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        line-height: 1;
        transition: all 0.18s;
    }

    .close-btn:hover { color: var(--text); border-color: var(--border-bright); }

    .modal-body {
        flex: 1;
        overflow-y: auto;
    }

    .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 200px;
        color: var(--text-muted);
        gap: 10px;
        font-size: 14px;
    }

    .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid var(--border-bright);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .modal-body pre {
        margin: 0 !important;
        border-radius: 0 !important;
        font-family: 'JetBrains Mono', monospace !important;
        font-size: 13px !important;
        line-height: 1.65 !important;
        padding: 20px !important;
        min-height: 100%;
    }

    .modal-body pre code { font-family: inherit !important; }

    /* ── FOOTER ── */
    footer {
        text-align: center;
        padding: 28px;
        border-top: 1px solid var(--border);
        color: var(--text-muted);
        font-size: 13px;
    }

    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--surface); }
    ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ── SNIPPETS SECTION ── */
    .snippets-section {
        max-width: 1440px;
        margin: 0 auto;
        padding: 0 24px 56px;
    }

    .snippets-header {
        border-top: 1px solid var(--border);
        padding-top: 32px;
        margin-bottom: 20px;
    }

    .snippets-title-row {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .snippets-icon {
        font-size: 28px;
        line-height: 1;
    }

    .snippets-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
    }

    .snippets-sub {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 3px;
    }

    .snippets-sub code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        background: rgba(255,255,255,0.06);
        padding: 1px 6px;
        border-radius: 4px;
        color: var(--accent);
    }

    .snippets-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
    }

    .snippet-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: all 0.18s;
    }

    .snippet-card:hover {
        border-color: var(--border-bright);
        background: var(--card);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .snippet-card-top {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .snippet-cat-icon {
        font-size: 20px;
        line-height: 1;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(52,211,153,0.1);
        border-radius: var(--radius-sm);
        flex-shrink: 0;
    }

    .snippet-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
    }

    .snippet-desc {
        font-size: 12px;
        color: var(--text-muted);
        line-height: 1.5;
        flex: 1;
    }

    .snippet-actions {
        display: flex;
        gap: 7px;
    }

    .snippet-btn {
        flex: 1;
        padding: 7px 8px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        border: none;
        transition: all 0.18s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }

    .snippet-btn-view {
        background: rgba(52,211,153,0.09);
        color: #34d399;
        border: 1px solid rgba(52,211,153,0.2);
    }

    .snippet-btn-view:hover { background: rgba(52,211,153,0.18); border-color: rgba(52,211,153,0.4); }

    .snippet-btn-dl {
        background: rgba(124,92,252,0.09);
        color: var(--accent2);
        border: 1px solid rgba(124,92,252,0.2);
    }

    .snippet-btn-dl:hover { background: rgba(124,92,252,0.18); border-color: rgba(124,92,252,0.4); }

    @media (max-width: 600px) {
        header { padding: 32px 16px 24px; }
        .controls { padding: 20px 16px 0; }
        .stats { padding: 12px 16px 4px; }
        .grid { grid-template-columns: 1fr; padding: 8px 16px 40px; gap: 12px; }
        .profiles a span { display: none; }
        .snippets-section { padding: 0 16px 40px; }
        .snippets-grid { grid-template-columns: 1fr 1fr; }
    }
    </style>
</head>
<body>

<header>
    <div class="header-badge">⚡ Competitive Programming</div>
    <h1>CP Templates</h1>
    <p>Ahmed Hossam's algorithm & data structure reference library</p>
    <div class="profiles">

<div class="controls">
    <div class="search-wrap">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>

            <span class="snippets-icon">✂️</span>

                <div class="snippets-title">VS Code Snippets</div>

<!-- Code Viewer Modal -->
<div class="overlay" id="overlay" onclick="onOverlayClick(event)">
    <div class="modal">
        <div class="modal-head">
            <div class="modal-fname" id="mFname"></div>
            <div class="modal-acts">
                <button class="mbtn" id="copyBtn" onclick="copyCode()">

                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download
                </button>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
        </div>
        <div class="modal-body" id="mBody">
            <div class="loading"><div class="spinner"></div> Loading…</div>
        </div>
    </div>
</div>

<script>
const RAW = 'https://raw.githubusercontent.com/7oSkaaa/CP-Templates/main/';

const CATS = {
    'Contest':             { color: '#f59e0b', bg: 'rgba(245,158,11,0.12)',  icon: '🏆' },
    'Graph':               { color: '#10b981', bg: 'rgba(16,185,129,0.12)',  icon: '🕸️' },
    'Data Structures':     { color: '#6366f1', bg: 'rgba(99,102,241,0.12)', icon: '🗂️' },
    'Range Query':         { color: '#fb923c', bg: 'rgba(251,146,60,0.12)', icon: '📊' },
    'Hashing':             { color: '#ec4899', bg: 'rgba(236,72,153,0.12)', icon: '#️⃣' },
    'Dynamic Programming': { color: '#8b5cf6', bg: 'rgba(139,92,246,0.12)', icon: '📈' },
    'String':              { color: '#06b6d4', bg: 'rgba(6,182,212,0.12)',  icon: '📝' },

let activeCat = 'All';
let query = '';
let curCode = '';

function cs(cat) { return CATS[cat] || { color:'#00cfff', bg:'rgba(0,207,255,0.12)', icon:'📄' }; }

function renderPills() {
    const counts = { All: T.length };
    T.forEach(t => { counts[t.c] = (counts[t.c] || 0) + 1; });
    const cats = ['All', ...Object.keys(CATS)];
    document.getElementById('pills').innerHTML = cats
        .filter(c => c === 'All' || counts[c])
        .map(c => {
            const s = cs(c);
            const active = activeCat === c;
            const style = active && c !== 'All'
                ? `style="background:${s.bg};border-color:${s.color}50;color:${s.color}"`
                : '';
            return `<button class="pill${active?' active':''}" ${style} onclick="setCat('${c.replace(/'/g,"\\'")}')">
                ${c === 'All' ? '⚡' : s.icon} ${c}<span class="cnt">${counts[c]||0}</span>
            </button>`;
        }).join('');
}

function setCat(c) { activeCat = c; renderPills(); renderGrid(); }

function filtered() {
    return T.filter(t => {
        const mc = activeCat === 'All' || t.c === activeCat;
        const q = query.toLowerCase();
        const ms = !q || [t.n, t.c, t.d, t.f].some(s => s.toLowerCase().includes(q));
        return mc && ms;
    });
}

function renderGrid() {
    const list = filtered();
    document.getElementById('stats').innerHTML =
        `Showing <span>${list.length}</span> of <span>${T.length}</span> templates`;

    if (!list.length) {
        document.getElementById('grid').innerHTML =
            `<div class="empty"><h3>No templates found</h3><p>Try a different search or filter</p></div>`;
        return;
    }

    document.getElementById('grid').innerHTML = list.map(t => {
        const s = cs(t.c);
        return `<div class="card" style="--cat-color:${s.color};--cat-bg:${s.bg}">
            <div class="card-top">
                <div class="card-title">${t.n}</div>
                <div class="card-icon">${s.icon}</div>
            </div>
            <span class="cat-badge" style="color:${s.color};background:${s.bg}">${t.c}</span>
            <div class="card-desc">${t.d}</div>
            <div class="card-file">${t.f}</div>
            <div class="card-actions">
                <button class="btn btn-view" onclick="viewCode('${t.f}','${t.n.replace(/'/g,"\\'")}')">
                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    View Code
                </button>
                <button class="btn btn-dl" onclick="dlFile('${t.f}')">
                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download
                </button>
            </div>
        </div>`;
    }).join('');
}

function viewCode(file, name) {
    curFile = file; curCode = '';
    document.getElementById('mFname').textContent = file;
    document.getElementById('mBody').innerHTML = '<div class="loading"><div class="spinner"></div> Loading…</div>';
    document.getElementById('mDlBtn').onclick = () => dlFile(file);
    document.getElementById('overlay').classList.add('open');
    document.body.style.overflow = 'hidden';

    fetch(RAW + file)
        .then(r => { if (!r.ok) throw new Error(); return r.text(); })
        .then(code => {
            curCode = code;
            const pre = document.createElement('pre');
            const el = document.createElement('code');
            el.className = file.endsWith('.code-snippets') ? 'language-json' : 'language-cpp';
            el.textContent = code;
            pre.appendChild(el);
            document.getElementById('mBody').innerHTML = '';
            document.getElementById('mBody').appendChild(pre);
            hljs.highlightElement(el);
        })
        .catch(() => {
            document.getElementById('mBody').innerHTML =
                '<div class="loading">Failed to load — check your connection.</div>';
        });
}

function closeModal() {
    document.getElementById('overlay').classList.remove('open');
    document.body.style.overflow = '';
}

function onOverlayClick(e) {
    if (e.target === document.getElementById('overlay')) closeModal();
}

function copyCode() {
    if (!curCode) return;
    navigator.clipboard.writeText(curCode).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.classList.add('ok');
        btn.innerHTML = `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
        setTimeout(() => {
            btn.classList.remove('ok');
            btn.innerHTML = `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy`;
        }, 2000);
    });
}

async function dlFile(file) {
    try {
        const res = await fetch(RAW + file);
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = file;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    } catch {
        window.open(RAW + file, '_blank');
    }
}

document.getElementById('searchInput').addEventListener('input', e => {
    query = e.target.value;

});

}
